name: Spring Boot CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: guarderiasql
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 0000
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d guarderiasql"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar tests y compilar
        run: mvn clean verify